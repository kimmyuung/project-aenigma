server:
  port: 8081  # API 서버(8080)와 분리된 포트

spring:
  application:
    name: aenigma-socket
  
  # 데이터베이스 설정 (aenigma-domain 사용)
  datasource:
    url: jdbc:mariadb://localhost:3306/aenigma?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마 검증만 (생성은 API 서버에서)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

# Discord Bot 설정
discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:}
    enabled: ${DISCORD_ENABLED:false}

logging:
  level:
    com.aenigma.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.web.socket: DEBUG

