server:
  port: 8080

spring:
  application:
    name: aenigma-api
  
  # 데이터베이스 설정
  datasource:
    url: jdbc:mariadb://localhost:3306/aenigma?useUnicode=true&characterEncoding=utf8mb4
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: org.mariadb.jdbc.Driver
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: true
  
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

# JWT 설정
jwt:
  # 256비트 이상의 secret key를 Base64로 인코딩한 값
  # 프로덕션에서는 환경변수로 주입: ${JWT_SECRET_KEY}
  secret-key: ZW5pZ21hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0yMDI1LTI1Ni1iaXRz
  access-token-expiration: 3600000    # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)
  issuer: aenigma

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 로깅 설정
logging:
  level:
    com.aenigma: DEBUG
    org.springframework.security: DEBUG
